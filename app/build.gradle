plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 读取签名配置（keystore.properties 与 sxsy.keystore 位于工程根目录，勿外传）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.sxsy45.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sxsy45.app"
        minSdk 21
        targetSdk 34
        // 修复自动签到后递增：装完能在「设置-应用信息」里对得上版本号，
        // 避免用户装到旧包还以为没修好。
        // 1.9.2：移除自动签到 + 下载文件名保留原后缀 + 去除文件名前的网址水印
        // 1.9.3：用官方密钥重签（可覆盖安装官方 1.9.0，无需卸载）
        versionCode 47
        versionName "1.9.3"
    }

    signingConfigs {
        // debug 包也启用 v1 + v2 + v3：默认 debug 只带 v1 + v2，缺 v3
        debug {
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
        release {
            storeFile rootProject.file(keystoreProperties['storeFile'] ?: 'sxsy.keystore')
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            // 签名方案加固：同时启用 v1(JAR) + v2 + v3，最大化兼容性与安全性
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
